<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
             <link rel="stylesheet" href="style.css"><script src="theme.js?v=2"></script>
      
    <title>Employees | Delivery Project</title>
</head>
<body class="appPage">

    <a class="skipLink" href="#pageContent">Skip to content</a>

<main class="mainLayout">
    <aside class="optionSec">
        <div class="sidebarTitle">MENU</div>
    
        <button id="dashboardButton">Dashboard</button>
        <button id="deliveriesButton">Deliveries</button>
        <button id="driversButton">Drivers</button>
        <button id="mapButton">Live Map</button>
        <button id="customersButton">Customers</button>
        <button id="employeeButton" class="active" aria-current="page">Employees</button>
        <button id="reportsButton">Reports</button>
        <button id="riderButton">Submit Delivery</button>
        <button id="settingsButton">Settings</button>
    
        <div class="sidebarBottom">
            <button id="sidebarLogoutButton">Logout</button>
        </div>
    </aside>
    <section class="dashboardSec listPage" id="pageContent" tabindex="-1">
        <div class="dashboardHead">
            <div class="pageHead">
                <h1>Employees</h1>
                <p>Manage company employees and roles</p>
            </div>
            <div class="pageActions">
                <div class="accountWrap">
                    <button id="liveAccountButton" class="accountBtn" type="button" aria-haspopup="true" aria-expanded="false" aria-controls="liveAccountMenu" aria-label="Account menu">
                        <img src="assets/company-logo.svg" alt="">
                    </button>
                    <div id="liveAccountMenu" class="accountMenu" role="menu" hidden>
                        <button id="liveProfileButton" type="button" role="menuitem">Profile</button>
                        <button id="liveLogoutButton" type="button" role="menuitem">Logout</button>
                    </div>
                </div>
            </div>
        </div>

        <div class="panel">
            <div class="toolbar">
                <input type="text" id="employeeSearch" placeholder="Search employee..." aria-label="Search employees" maxlength="60">

                <select id="employeeRole" aria-label="Filter by role">
                    <option value="">All Roles</option>
                    <option value="Admin">Admin</option>
                    <option value="Employee">Employee</option>
                    <option value="Driver">Driver</option>
                    <option value="Rider">Rider</option>
                </select>

                <select id="employeeStatus" aria-label="Filter by status">
                    <option value="">All Status</option>
                    <option value="Active">Active</option>
                    <option value="Disabled">Disabled</option>
                </select>
            </div>
        </div>

        <div class="panel tablePanel">
            <h2>Employees Overview</h2>
            <p>List of all users and employees in the system</p>

            <div class="tableWrapper">
                <table class="dataTable" data-mobile-cards>
                    <thead>
                        <tr>
                            <th scope="col">Employee ID</th>
                            <th scope="col">Full Name</th>
                            <th scope="col">Username</th>
                            <th scope="col">Email</th>
                            <th scope="col">Contact Number</th>
                            <th scope="col">Role</th>
                            <th scope="col">Status</th>
                            <th scope="col">Action</th>
                        </tr>
                    </thead>
                    <tbody id="employeeRows"></tbody>
                </table>
            </div>
        </div>
    </section>

    <!-- View Employee Modal -->
    <div class="modal" id="empViewModal" role="dialog" aria-modal="true" aria-labelledby="empViewTitle">
        <div class="modalBox viewBox">
            <div class="modalHeader">
                <h2 id="empViewTitle">Employee</h2>
                <button class="modalClose" id="closeEmpView" type="button" aria-label="Close">&times;</button>
            </div>
            <div id="empViewBody"></div>
        </div>
    </div>
</main>

<script src="app.js"></script>
<script src="employees.js"></script>
</body>
</html>
