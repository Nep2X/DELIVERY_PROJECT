<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>bfcache harness</title>
  <script src="theme.js?v=3"></script>
  <link rel="stylesheet" href="style.css?v=3">
  <link rel="stylesheet" href="spa.css?v=3">
  <script>
    const role = new URLSearchParams(location.search).get("role") || "Admin";
    const json = (data) =>
      new Response(JSON.stringify(data), {
        status: 200,
        headers: { "Content-Type": "application/json" },
      });
    window.fetch = async (url) => {
      const target = String(url);
      if (target.includes("api/auth.php?action=me")) {
        return json({ ok: true, user: { role, name: "Harness", username: "harness" } });
      }
      if (target.includes("api/dashboard.php")) {
        return json({ ok: true, total: 0, counts: {}, active: 0, overdue: 0, today_total: 0, recent: [], chart: {}, drivers: {} });
      }
      if (target.includes("api/reports.php")) {
        return json({ ok: true, total: 0, counts: {}, by_driver: [], by_customer: [], by_month: [], deliveries: [], rider_reports: [] });
      }
      if (target.includes("api/deliveries.php")) return json([]);
      if (target.includes("api/customers.php") || target.includes("api/drivers.php") || target.includes("api/users.php")) return json([]);
      return json({ ok: true });
    };
  </script>
</head>
<body class="spaBody">
  <a class="skipLink" href="#mainContent">Skip to content</a>
  <div id="app"></div>
  <script type="module" src="spa/main.js"></script>
</body>
</html>
